[pytest]
# Custom markers applied in tests/conftest.py. Registering them here silences
# PytestUnknownMarkWarning and makes `pytest --markers` self-documenting.
#
# Kept in pytest.ini rather than pyproject.toml so that adding pytest
# configuration does not change how ruff discovers its own settings.
markers =
    integration: requires external services (Docker, instruments); deselected in CI with -m "not integration"
    slow: long-running; repeats a simulation to check determinism
